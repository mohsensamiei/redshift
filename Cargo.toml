[workspace]
resolver = "3"
members = [
    "crates/sim",
    "crates/data",
    "crates/net",
    "crates/render",
    "crates/app",
    "server",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/mohsensamiei/redshift"

[workspace.dependencies]
redshift-sim = { path = "crates/sim" }
redshift-data = { path = "crates/data" }
redshift-net = { path = "crates/net" }
redshift-render = { path = "crates/render" }

bevy = { version = "0.19.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
bincode = { version = "2", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }

# Dev builds: the simulation is the hot path even while iterating, and an
# unoptimised A* makes the game unusable. Optimise dependencies always, and
# our own crates enough to stay interactive, while keeping debug assertions.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
